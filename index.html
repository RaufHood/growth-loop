<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Growth Loop"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f4f1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Growth Loop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single mobile column, sticky header, fixed bottom tab bar. Moss-green "growth" accent on cool paper. */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --fg: #18211c; --muted: #5d6a62; --line: #dbe1dc;
  --accent: #2c7a4b; --accent-fg: #ffffff; --warn: #b4542d; --empty: #e3e8e4;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111613; --surface: #19201c; --fg: #e4ebe6; --muted: #93a19a; --line: #2a332e;
  --accent: #5cbf84; --accent-fg: #0d1a12; --warn: #e48a62; --empty: #232c27; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201c; --fg: #e4ebe6; --muted: #93a19a; --line: #2a332e;
  --accent: #5cbf84; --accent-fg: #0d1a12; --warn: #e48a62; --empty: #232c27; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)) }
header { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 16px 12px; z-index: 5; display: flex; justify-content: space-between; align-items: baseline; gap: 12px }
h1 { font: 800 1.6rem/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h2 { font: 600 1.15rem/1.2 var(--display); margin: 0; text-wrap: balance }
.sub { color: var(--muted); font-size: .9rem }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
section { display: grid; gap: 12px; margin-top: 20px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0 }
.banner { font-size: .85rem; color: var(--warn); border: 1px solid var(--warn); border-radius: 10px; padding: 8px 12px }

.habit { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font: 500 1rem var(--body); cursor: pointer; min-height: 60px }
.habit .tick { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: background .15s, border-color .15s }
.habit .tick svg { width: 16px; height: 16px; opacity: 0 }
.habit.done { border-color: var(--accent) }
.habit.done .tick { background: var(--accent); border-color: var(--accent) }
.habit.done .tick svg { opacity: 1 }
.habit .meta { margin-left: auto; color: var(--muted); font: 500 .8rem var(--mono); white-space: nowrap }
.habit .name { min-width: 0; overflow-wrap: anywhere }
.goaltag { display: block; color: var(--muted); font-size: .78rem; font-weight: 400 }

.daynav { display: flex; gap: 8px }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 14px; font: 500 .85rem var(--body); cursor: pointer }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }

label.field { display: grid; gap: 6px; font-weight: 500; font-size: .9rem }
textarea, input[type=text], select { width: 100%; font: 400 1rem var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px }
textarea { resize: vertical; min-height: 64px }
textarea:focus, input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 10px 16px; font: 600 .95rem var(--body); cursor: pointer }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line) }
.btn.small { padding: 6px 10px; font-size: .8rem }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.row > .grow { flex: 1 1 180px; min-width: 0 }
.saved { font-size: .8rem; color: var(--accent); min-height: 1.2em }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.stat { display: grid; gap: 2px }
.stat b { font: 600 1.4rem var(--mono); font-variant-numeric: tabular-nums }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto }
.heat i { width: 100%; aspect-ratio: 1; min-width: 10px; border-radius: 3px; background: var(--empty) }
.heat i.on { background: var(--accent) }
.heat i.future { background: transparent }
.heat i.today { outline: 1.5px solid var(--fg); outline-offset: -1.5px }
.bars { display: grid; grid-template-columns: repeat(12, 1fr); align-items: end; gap: 4px; height: 110px; border-bottom: 1px solid var(--line) }
.bars div { background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px }
.bars div.zero { background: var(--empty) }
.barlabels { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; font: 500 .62rem var(--mono); color: var(--muted); text-align: center }

.prev { border-left: 3px solid var(--accent); padding-left: 12px }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
ul.plain li { overflow-wrap: anywhere }
details.past { border-top: 1px solid var(--line); padding-top: 10px }
details.past summary { cursor: pointer; font-weight: 600 }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; display: grid; gap: 12px; justify-items: center }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 6 }
nav.tabs button { background: none; border: 0; color: var(--muted); font: 600 .75rem var(--body); padding: 10px 4px 12px; display: grid; justify-items: center; gap: 4px; cursor: pointer }
nav.tabs button svg { width: 22px; height: 22px }
nav.tabs button[aria-current="page"] { color: var(--accent) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="wrap">
  <header><h1 id="title">Today</h1><span class="sub mono" id="hdate"></span></header>
  <div id="banner"></div>
  <main id="view"><div class="empty">Loading your habits…</div></main>
</div>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Today</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4z"/></svg>Review</button>
  <button data-tab="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Habits</button>
</nav>

<script>
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="m5 12 5 5 9-10" stroke="var(--accent-fg)"/></svg>';
const state = { config: { goals: [], habits: [] }, days: {}, weeks: {}, ready: false };
let tab = "today", dayOffset = 0, reviewOffset = 0, needsRender = false;
let store = null;

// ---------- dates ----------
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
const monday = d => addDays(d, -((d.getDay() + 6) % 7));
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const fmt = (d, o) => d.toLocaleDateString(undefined, o);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);

// ---------- storage: private db per viewer, device storage as fallback ----------
function localStore() {
  const KEY = "growth-loop-v1";
  let all = {};
  try { all = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
  return {
    kind: "local",
    subscribe(cb) { cb(all); },
    async save(id, body) { all[id] = body; try { localStorage.setItem(KEY, JSON.stringify(all)); } catch {} },
  };
}

function dbStore(db, id) {
  const col = db.collection("data/users/" + id);
  const chains = {};
  return {
    kind: "db",
    subscribe(cb, onErr) {
      col.limit(1000).onSnapshot(snap => {
        const all = {};
        snap.docs.forEach(d => { all[d.id] = d.data(); });
        cb(all);
      }, onErr);
    },
    save(docId, body) {
      // one write at a time per document
      const run = () => col.doc(docId).set(body).catch(e => {
        if (e?.code === "unavailable") return new Promise(r => setTimeout(r, 400 + Math.random() * 600)).then(() => col.doc(docId).set(body));
        throw e;
      });
      chains[docId] = (chains[docId] || Promise.resolve()).then(run, run);
      return chains[docId].catch(e => showBanner("Couldn't save: " + (e?.message || e?.code || "unknown error") + ". Check your connection and try again."));
    },
  };
}

function apply(all) {
  state.config = all.config ? { goals: all.config.goals || [], habits: all.config.habits || [] } : { goals: [], habits: [] };
  state.days = {}; state.weeks = {};
  for (const [k, v] of Object.entries(all)) {
    if (k.startsWith("day-")) state.days[k.slice(4)] = v;
    else if (k.startsWith("week-")) state.weeks[k.slice(5)] = v;
  }
  state.ready = true;
  render();
}

function showBanner(msg) { document.getElementById("banner").innerHTML = msg ? `<p class="banner">${esc(msg)}</p>` : ""; }

async function boot() {
  let db = null, id = null;
  try {
    if (window.claude?.use) {
      db = await window.claude.use("db");
      const user = await window.claude.use("user");
      id = user ? await user.id() : null;
    }
  } catch {}
  if (db && id) store = dbStore(db, id);
  else { store = localStore(); if (window.claude?.use) showBanner("Saving on this device only. Sign in to claude.ai to sync across devices."); }
  store.subscribe(apply, e => showBanner("Sync stopped (" + e.code + "). Reload the page to reconnect."));
}

// ---------- data helpers ----------
const activeHabits = () => state.config.habits.filter(h => !h.archived);
const isDone = (date, hid) => !!state.days[date]?.done?.[hid];
const dayDoc = date => ({ date, done: {}, did: "", win: "", lesson: "", ...(state.days[date] || {}) });
function saveDay(date, patch) {
  const body = { ...dayDoc(date), ...patch };
  state.days[date] = body;
  return store.save("day-" + date, body);
}
function saveConfig() { return store.save("config", { goals: state.config.goals, habits: state.config.habits }); }

// "Never miss twice": one missed day keeps the streak alive, two in a row reset it.
function streaks(h) {
  const start = parse(h.created || ymd(today()));
  const t = today(), tKey = ymd(t);
  let cur = 0, best = 0, misses = 0;
  for (let d = new Date(start); d <= t; d = addDays(d, 1)) {
    const k = ymd(d);
    if (isDone(k, h.id)) { cur++; misses = 0; }
    else if (k !== tKey) { misses++; if (misses >= 2) cur = 0; }
    best = Math.max(best, cur);
  }
  return { cur, best };
}
function rate(hids, from, to) {
  let done = 0, total = 0;
  for (let d = new Date(from); d <= to; d = addDays(d, 1)) {
    const k = ymd(d);
    hids.forEach(h => {
      if (h.created && k < h.created) return;
      total++; if (isDone(k, h.id)) done++;
    });
  }
  return total ? Math.round(100 * done / total) : null;
}

// ---------- render ----------
function isEditing() {
  const a = document.activeElement;
  return a && document.getElementById("view").contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName);
}
function render() {
  if (isEditing()) { needsRender = true; return; }
  needsRender = false;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  document.getElementById("hdate").textContent = fmt(today(), { weekday: "short", day: "numeric", month: "short" });
  const titles = { today: "Today", progress: "Progress", review: "Review", habits: "Goals & habits" };
  document.getElementById("title").textContent = titles[tab];
  if (!state.ready) return;
  const v = document.getElementById("view");
  v.innerHTML = { today: viewToday, progress: viewProgress, review: viewReview, habits: viewHabits }[tab]();
}

function emptyHabits() {
  return `<div class="card empty"><h2>Start with 1–3 habits</h2><p>Pick small daily actions that move a goal forward. You can add more later.</p><button class="btn" data-go="habits">Add habits</button></div>`;
}

function viewToday() {
  const hs = activeHabits();
  if (!hs.length) return `<section>${emptyHabits()}</section>`;
  const date = ymd(addDays(today(), -dayOffset));
  const d = dayDoc(date);
  const doneN = hs.filter(h => isDone(date, h.id)).length;
  const goal = id => state.config.goals.find(g => g.id === id)?.title;
  return `
  <section>
    <div class="row" style="justify-content:space-between">
      <div class="daynav">
        <button class="chip" data-day="0" aria-pressed="${dayOffset === 0}">Today</button>
        <button class="chip" data-day="1" aria-pressed="${dayOffset === 1}">Yesterday</button>
      </div>
      <span class="mono" aria-label="habits done">${doneN}/${hs.length} done</span>
    </div>
    ${hs.map(h => { const s = streaks(h); return `
      <button class="habit ${isDone(date, h.id) ? "done" : ""}" data-toggle="${h.id}" aria-pressed="${isDone(date, h.id)}">
        <span class="tick">${TICK}</span>
        <span class="name">${esc(h.title)}${goal(h.goalId) ? `<span class="goaltag">→ ${esc(goal(h.goalId))}</span>` : ""}</span>
        <span class="meta" title="current streak">${s.cur}d</span>
      </button>`; }).join("")}
  </section>
  <section class="card">
    <label class="field">What did I do ${dayOffset ? "yesterday" : "today"}?
      <textarea id="f-did" data-day-field="did" rows="2" placeholder="One or two lines is enough">${esc(d.did)}</textarea></label>
    <label class="field">Win <span class="sub">— optional</span>
      <input type="text" id="f-win" data-day-field="win" value="${esc(d.win)}" placeholder="Something that went well"></label>
    <label class="field">Lesson <span class="sub">— optional</span>
      <input type="text" id="f-lesson" data-day-field="lesson" value="${esc(d.lesson)}" placeholder="Something I learned or would do differently"></label>
    <div class="saved" id="saved-day" aria-live="polite"></div>
  </section>`;
}

function viewProgress() {
  const hs = activeHabits();
  if (!hs.length) return `<section>${emptyHabits()}</section>`;
  const t = today(), wkStart = monday(t);
  const weeks = [...Array(12)].map((_, i) => addDays(wkStart, -7 * (11 - i)));
  const rates = weeks.map(w => rate(hs, w, addDays(w, 6) > t ? t : addDays(w, 6)) ?? 0);
  const thisWeek = rates[11], lastWeek = rates[10];
  const r30 = rate(hs, addDays(t, -29), t) ?? 0;
  const gridStart = addDays(wkStart, -7 * 11);
  const heat = h => {
    let cells = "";
    for (let i = 0; i < 84; i++) {
      const d = addDays(gridStart, i), k = ymd(d);
      const cls = d > t ? "future" : isDone(k, h.id) ? "on" : "";
      cells += `<i class="${cls} ${k === ymd(t) ? "today" : ""}" title="${k}"></i>`;
    }
    return `<div class="heat" role="img" aria-label="Last 12 weeks for ${esc(h.title)}">${cells}</div>`;
  };
  return `
  <section class="card">
    <div class="stats">
      <div class="stat"><span class="label">This week</span><b>${thisWeek}%</b></div>
      <div class="stat"><span class="label">Last week</span><b>${lastWeek}%</b></div>
      <div class="stat"><span class="label">30 days</span><b>${r30}%</b></div>
    </div>
    <span class="label">Habits done per week, last 12 weeks</span>
    <div class="bars">${rates.map(r => `<div class="${r ? "" : "zero"}" style="height:${Math.max(r, 2)}%" title="${r}%"></div>`).join("")}</div>
    <div class="barlabels">${weeks.map(w => `<span>${w.getDate()}.${w.getMonth() + 1}</span>`).join("")}</div>
  </section>
  ${hs.map(h => { const s = streaks(h); const r = rate([h], addDays(t, -29), t) ?? 0; return `
  <section class="card">
    <div class="row" style="justify-content:space-between"><h2>${esc(h.title)}</h2></div>
    <div class="stats">
      <div class="stat"><span class="label">Streak</span><b>${s.cur}</b></div>
      <div class="stat"><span class="label">Best</span><b>${s.best}</b></div>
      <div class="stat"><span class="label">30 days</span><b>${r}%</b></div>
    </div>
    ${heat(h)}
  </section>`; }).join("")}
  <p class="sub">Streaks follow "never miss twice": one missed day keeps the streak, two in a row reset it.</p>`;
}

function viewReview() {
  const t = today();
  const wk = addDays(monday(t), -7 * reviewOffset), wkKey = ymd(wk);
  const end = addDays(wk, 6) > t ? t : addDays(wk, 6);
  const prevKey = ymd(addDays(wk, -7));
  const hs = activeHabits();
  const r = rate(hs, wk, end), rPrev = rate(hs, addDays(wk, -7), addDays(wk, -1));
  const w = state.weeks[wkKey] || {};
  const prev = state.weeks[prevKey];
  const wins = [], lessons = [];
  for (let d = new Date(wk); d <= end; d = addDays(d, 1)) {
    const x = state.days[ymd(d)]; const tag = fmt(d, { weekday: "short" });
    if (x?.win) wins.push(`<li><span class="mono sub">${tag}</span> ${esc(x.win)}</li>`);
    if (x?.lesson) lessons.push(`<li><span class="mono sub">${tag}</span> ${esc(x.lesson)}</li>`);
  }
  const past = Object.keys(state.weeks).filter(k => k !== wkKey && (state.weeks[k].good || state.weeks[k].bad || state.weeks[k].change)).sort().reverse();
  return `
  <section>
    <div class="daynav">
      <button class="chip" data-week="0" aria-pressed="${reviewOffset === 0}">This week</button>
      <button class="chip" data-week="1" aria-pressed="${reviewOffset === 1}">Last week</button>
    </div>
    <p class="sub">Week of ${fmt(wk, { day: "numeric", month: "long" })}</p>
  </section>
  ${prev?.change ? `<section class="card prev"><span class="label">Last week I planned to change</span><p style="margin:0">${esc(prev.change)}</p><span class="sub">Did you do it? Note it below.</span></section>` : ""}
  <section class="card">
    <div class="stats">
      <div class="stat"><span class="label">Habits done</span><b>${r ?? "–"}${r == null ? "" : "%"}</b></div>
      <div class="stat"><span class="label">Week before</span><b>${rPrev ?? "–"}${rPrev == null ? "" : "%"}</b></div>
      <div class="stat"><span class="label">Change</span><b>${r != null && rPrev != null ? (r - rPrev >= 0 ? "+" : "") + (r - rPrev) : "–"}</b></div>
    </div>
    ${wins.length ? `<span class="label">Wins this week</span><ul class="plain">${wins.join("")}</ul>` : ""}
    ${lessons.length ? `<span class="label">Lessons this week</span><ul class="plain">${lessons.join("")}</ul>` : ""}
  </section>
  <section class="card">
    <label class="field">What went well?<textarea id="w-good" data-week-field="good" rows="3">${esc(w.good)}</textarea></label>
    <label class="field">What didn't go well?<textarea id="w-bad" data-week-field="bad" rows="3">${esc(w.bad)}</textarea></label>
    <label class="field">One thing I'll change next week<textarea id="w-change" data-week-field="change" rows="2">${esc(w.change)}</textarea></label>
    <div class="saved" id="saved-week" aria-live="polite"></div>
  </section>
  ${past.length ? `<section class="card"><h2>Past reviews</h2>${past.map(k => { const p = state.weeks[k]; return `
    <details class="past"><summary>Week of ${fmt(parse(k), { day: "numeric", month: "short", year: "numeric" })}</summary>
      ${p.good ? `<p><span class="label">Went well</span><br>${esc(p.good)}</p>` : ""}
      ${p.bad ? `<p><span class="label">Didn't</span><br>${esc(p.bad)}</p>` : ""}
      ${p.change ? `<p><span class="label">Change</span><br>${esc(p.change)}</p>` : ""}
    </details>`; }).join("")}</section>` : ""}`;
}

function viewHabits() {
  const { goals } = state.config;
  const hs = activeHabits();
  const archived = state.config.habits.filter(h => h.archived);
  const goalOpts = sel => `<option value="">No goal</option>` + goals.filter(g => !g.archived).map(g => `<option value="${g.id}" ${g.id === sel ? "selected" : ""}>${esc(g.title)}</option>`).join("");
  return `
  <section class="card">
    <h2>Goals</h2>
    <p class="sub" style="margin:0">What you want to reach. Link each habit to the goal it moves forward.</p>
    <ul class="plain">${goals.filter(g => !g.archived).map(g => `
      <li class="row"><span class="grow">${esc(g.title)}</span><button class="btn ghost small" data-archive-goal="${g.id}">Remove</button></li>`).join("") || `<li class="sub">No goals yet.</li>`}</ul>
    <form class="row" data-form="goal"><input class="grow" type="text" id="new-goal" placeholder="e.g. Ship my side project by March" required><button class="btn">Add goal</button></form>
  </section>
  <section class="card">
    <h2>Daily habits</h2>
    ${hs.length > 5 ? `<p class="banner">You have ${hs.length} habits. Fewer habits done every day beat many done sometimes. Consider archiving some.</p>` : ""}
    <ul class="plain">${hs.map(h => `
      <li class="row"><span class="grow">${esc(h.title)}</span>
        <select aria-label="Goal for ${esc(h.title)}" id="goal-${h.id}" data-habit-goal="${h.id}" style="width:auto;max-width:45%">${goalOpts(h.goalId)}</select>
        <button class="btn ghost small" data-archive="${h.id}">Archive</button></li>`).join("") || `<li class="sub">No habits yet. Try: "Code 1 hour", "Read 20 pages", "Workout".</li>`}</ul>
    <form class="row" data-form="habit">
      <input class="grow" type="text" id="new-habit" placeholder="e.g. Code for 1 hour" required>
      <select id="new-habit-goal" style="width:auto;max-width:45%" aria-label="Goal">${goalOpts("")}</select>
      <button class="btn">Add habit</button>
    </form>
  </section>
  ${archived.length ? `<section class="card"><h2>Archived</h2><p class="sub" style="margin:0">History is kept.</p><ul class="plain">${archived.map(h => `
    <li class="row"><span class="grow">${esc(h.title)}</span><button class="btn ghost small" data-restore="${h.id}">Restore</button></li>`).join("")}</ul></section>` : ""}
  <section class="card">
    <h2>Backup</h2>
    <p class="sub" style="margin:0">${store?.kind === "db" ? "Your data is saved privately to your claude.ai account and syncs across devices." : "Your data is saved on this device only."}</p>
    <div class="row"><button class="btn ghost" data-export>Copy all data</button><span class="saved" id="saved-export"></span></div>
  </section>`;
}

// ---------- events ----------
const flash = (id, msg) => { const el = document.getElementById(id); if (el) { el.textContent = msg; setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 1800); } };

document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});

document.getElementById("view").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const ds = t.dataset;
  if (ds.go) { tab = ds.go; render(); }
  else if (ds.day) { dayOffset = +ds.day; render(); }
  else if (ds.week) { reviewOffset = +ds.week; render(); }
  else if (ds.toggle) {
    const date = ymd(addDays(today(), -dayOffset));
    const done = { ...dayDoc(date).done, [ds.toggle]: !isDone(date, ds.toggle) };
    saveDay(date, { done }); render();
  }
  else if (ds.archive || ds.restore) {
    const h = state.config.habits.find(x => x.id === (ds.archive || ds.restore));
    h.archived = !!ds.archive; saveConfig(); render();
  }
  else if (ds.archiveGoal) {
    const g = state.config.goals.find(x => x.id === ds.archiveGoal);
    g.archived = true;
    state.config.habits.forEach(h => { if (h.goalId === g.id) h.goalId = ""; });
    saveConfig(); render();
  }
  else if ("export" in ds) {
    const text = JSON.stringify({ config: state.config, days: state.days, weeks: state.weeks }, null, 2);
    navigator.clipboard.writeText(text).then(() => flash("saved-export", "Copied. Paste it into a note to keep a backup."), () => flash("saved-export", "Copy was blocked by the browser."));
  }
});

document.getElementById("view").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "goal") {
    const v = document.getElementById("new-goal").value.trim(); if (!v) return;
    state.config.goals.push({ id: uid(), title: v, created: ymd(today()) });
  } else if (f === "habit") {
    const v = document.getElementById("new-habit").value.trim(); if (!v) return;
    state.config.habits.push({ id: uid(), title: v, goalId: document.getElementById("new-habit-goal").value, created: ymd(today()) });
  }
  saveConfig();
  document.activeElement?.blur();
  render();
});

document.getElementById("view").addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.dayField) {
    const date = ymd(addDays(today(), -dayOffset));
    saveDay(date, { [el.dataset.dayField]: el.value.trim() }).then(() => flash("saved-day", "Saved"));
  } else if (el.dataset.weekField) {
    const wkKey = ymd(addDays(monday(today()), -7 * reviewOffset));
    const body = { weekStart: wkKey, ...(state.weeks[wkKey] || {}), [el.dataset.weekField]: el.value.trim() };
    state.weeks[wkKey] = body;
    store.save("week-" + wkKey, body).then(() => flash("saved-week", "Saved"));
  } else if (el.dataset.habitGoal) {
    state.config.habits.find(h => h.id === el.dataset.habitGoal).goalId = el.value;
    saveConfig();
  }
});

document.getElementById("view").addEventListener("focusout", () => {
  setTimeout(() => { if (needsRender && !isEditing()) render(); }, 0);
});

render();
boot();
</script>
</body></html>
